name: container-image

on:
  pull_request:
  push:
    branches: [main, feat/container-control-plane]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly authorize verified GHCR publication for this dispatch
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !(github.repository == 'joshyorko/codex-action-server' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/container-control-plane' || startsWith(github.ref, 'refs/tags/v'))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Build pinned amd64 runtime image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -f Containerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/joshyorko/codex-action-server" \
            -t codex-action-server:verified .
      - name: Prove catalog, native socket, and receipt persistence
        env:
          CODEX_ACTION_CONTAINER_IMAGE: codex-action-server:verified
        run: pytest -q -rs tests/test_container_runtime.py tests/test_runtime_transport_patch.py tests/test_mcp_annotations.py tests/test_container_image.py
  publish:
    if: >-
      github.repository == 'joshyorko/codex-action-server' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/container-control-plane' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ghcr-codex-action-server-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Reuse the immutable commit image for a release
        id: release_image
        if: github.repository == 'joshyorko/codex-action-server' && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/joshyorko/codex-action-server:sha-$GITHUB_SHA"
          docker pull "$image"
          revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          test "$revision" = "$GITHUB_SHA"
          docker tag "$image" codex-action-server:verified
      - name: Build the exact source image
        if: steps.release_image.outcome != 'success'
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -f Containerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/joshyorko/codex-action-server" \
            -t codex-action-server:verified .
      - name: Verify the exact local image
        env:
          CODEX_ACTION_CONTAINER_IMAGE: codex-action-server:verified
        run: |
          set -euo pipefail
          pytest -q -rs tests/test_container_runtime.py tests/test_runtime_transport_patch.py tests/test_mcp_annotations.py tests/test_container_image.py
          ruff check src tests scripts/preflight.py
          ruff format --check src tests scripts/preflight.py
      - name: Authenticate for GHCR publication
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable commit and release tags
        run: |
          set -euo pipefail
          image=ghcr.io/joshyorko/codex-action-server
          local_config="$(docker image inspect codex-action-server:verified --format '{{.Id}}')"
          publish_tag() {
            destination="$image:$1"
            if docker manifest inspect "$destination" > "$RUNNER_TEMP/existing-manifest.json" 2> "$RUNNER_TEMP/manifest-error.log"; then
              platform_digest="$(python3 -c 'import json,sys; m=json.load(sys.stdin); rows=[x["digest"] for x in m.get("manifests",[]) if x.get("platform",{}).get("os")=="linux" and x.get("platform",{}).get("architecture")=="amd64"]; print(rows[0] if rows else "")' < "$RUNNER_TEMP/existing-manifest.json")"
              if [ -n "$platform_digest" ]; then
                docker manifest inspect "$image@$platform_digest" > "$RUNNER_TEMP/existing-manifest.json"
              fi
              existing_config="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])' < "$RUNNER_TEMP/existing-manifest.json")"
              if [ "$existing_config" != "$local_config" ]; then
                printf 'Refusing to replace existing immutable tag %s\n' "$destination" >&2
                exit 1
              fi
            elif python3 -c 'import pathlib,sys; text=pathlib.Path(sys.argv[1]).read_text().lower(); sys.exit(0 if any(marker in text for marker in ["manifest unknown", "no such manifest", "not found"]) else 1)' "$RUNNER_TEMP/manifest-error.log"; then
              docker tag codex-action-server:verified "$destination"
              docker push "$destination"
            else
              cat "$RUNNER_TEMP/manifest-error.log" >&2
              exit 1
            fi
          }
          publish_tag "sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish_tag "${GITHUB_REF#refs/tags/}"
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
              docker tag codex-action-server:verified "$image:latest"
              docker push "$image:latest"
            else
              printf 'Skipping latest publication: main has advanced.\n'
            fi
          fi
          digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          # shellcheck disable=SC2016 # Literal Markdown backticks in the summary.
          printf 'Verified production pin: `%s@%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
