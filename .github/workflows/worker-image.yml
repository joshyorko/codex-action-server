name: worker-image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Build exact worker template
        run: |
          docker build --platform linux/amd64 -f Containerfile.worker \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/joshyorko/codex-action-server" \
            -t codex-worker:verified .
      - name: Verify blank image and lifecycle contract
        env:
          CODEX_WORKER_TEST_IMAGE: codex-worker:verified
        run: pytest -q tests/test_blank_worker_image.py tests/test_remote_setup_retained_config.py tests/test_remote_headroom_auth_policy.py
      - name: Publish verified main image
        if: github.repository == 'joshyorko/codex-action-server' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/joshyorko/codex-action-server
          destination="$image:worker-sha-$GITHUB_SHA"
          if docker manifest inspect "$destination" > "$RUNNER_TEMP/worker-existing.json" 2> "$RUNNER_TEMP/worker-manifest-error.log"; then
            docker pull "$destination"
            test "$(docker image inspect "$destination" --format '{{.Id}}')" = "$(docker image inspect codex-worker:verified --format '{{.Id}}')"
          elif python3 -c 'import pathlib,sys; t=pathlib.Path(sys.argv[1]).read_text().lower(); sys.exit(0 if any(s in t for s in ("manifest unknown", "no such manifest", "not found")) else 1)' "$RUNNER_TEMP/worker-manifest-error.log"; then
            docker tag codex-worker:verified "$destination"
            docker push "$destination"
          else
            cat "$RUNNER_TEMP/worker-manifest-error.log" >&2
            exit 1
          fi
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            docker tag codex-worker:verified "$image:worker-latest"
            docker push "$image:worker-latest"
          fi
