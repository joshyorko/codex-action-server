name: standalone-control-contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Install pinned Actions Runtime
        run: |
          mkdir -p "$RUNNER_TEMP/codex-action-test-bin"
          curl -fL --max-time 120 --retry 2 https://github.com/joshyorko/actions/releases/download/actions-runtime-1.0.1/actions-runtime-1.0.1-linux64 -o "$RUNNER_TEMP/codex-action-test-bin/action-server"
          echo "191f40cfebcadbd53bf7b14988098b983b99b4efc1aa8d8ac9e8ada6ad37ab3b  $RUNNER_TEMP/codex-action-test-bin/action-server" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codex-action-test-bin/action-server"
          echo "$RUNNER_TEMP/codex-action-test-bin" >> "$GITHUB_PATH"
      - run: pytest -q -rs
      - run: ruff check src tests
      - run: ruff format --check src tests
